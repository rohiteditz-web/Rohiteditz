<!DOCTYPE html>
<html>
<head>
    <title>Rohit | AI Creator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0f0f0f;
            color: white;
            text-align: center;
        }

        .container {
            padding: 80px 20px;
        }

        h1 {
            font-size: 45px;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 18px;
            max-width: 500px;
            margin: 20px auto;
            color: #bbb;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            margin: 15px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .insta {
            background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
            color: white;
        }

        .insta:hover {
            transform: scale(1.1);
        }

        .contact {
            background: #222;
            color: white;
            border: 1px solid #444;
        }

        .contact:hover {
            background: #333;
        }

        footer {
            margin-top: 80px;
            font-size: 14px;
            color: #666;
        }

    </style>
</head>

<body>

    <div class="container">
        <h1>Rohit AI Creator 🚀</h1>

        <p>
            Creating Viral AI Content 💡  
            Reels | AI Tools | Unique Apps  
            Follow for daily tech magic ✨
        </p>

        <!-- Instagram Button -->
        <a href="https://instagram.com/YOUR_USERNAME" target="_blank" class="btn insta">
            Follow on Instagram
        </a>

        <!-- Contact Button -->
        <a href="mailto:yourmail@gmail.com" class="btn contact">
            Contact Me
        </a>

        <footer>
            © 2026 Rohit | Premium AI Website 💎
        </footer>
    </div>

</body>
</html>
